<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 여행 사진 한 컷</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>오늘의 여행 사진 한 컷</h1>
        <p class="subtitle">마음에 드는 여행 사진을 클릭하고 한 줄 감상을 Firestore에 바로 저장해 보세요.</p>
      </div>
    </header>

    <div class="toolbar">
      <span class="badge">추천 여행지 5선</span>
      <button id="refresh-btn" class="btn btn-secondary">🔄 다른 사진 불러오기</button>
    </div>

    <!-- API 사진 5장 출력 영역 -->
    <div id="photo-list" class="card-grid">불러오는 중...</div>

    <!-- 한 줄 감상 입력 영역 -->
    <section class="review-box">
      <h2>✍️ 선택한 사진 한 줄 감상</h2>
      <p id="selected-photo-title" class="selected-info">위에서 사진 1장을 먼저 클릭해 주세요.</p>
      <div class="input-group">
        <input type="text" id="comment-input" placeholder="이 여행지에 대한 한 줄 감상을 입력하세요..." disabled />
        <button id="save-btn" class="btn btn-primary" disabled>감상 저장</button>
      </div>
    </section>

    <!-- Firestore에서 조회한 감상 목록 -->
    <section class="feed-box">
      <h2>📌 Firestore에 기록된 여행 감상</h2>
      <ul id="review-list" class="review-list">
        <li class="empty-msg">데이터를 불러오는 중...</li>
      </ul>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
